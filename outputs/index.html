<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#5e50d9" />
    <meta name="description" content="Orbit & Oak turns screen time into real-world missions for children." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css?version=8" />
    <title>Orbit &amp; Oak</title>
  </head>
  <body>
    <div id="app" aria-live="polite"></div>
    <div id="toast" class="toast" role="status" aria-live="assertive"></div>
    <script type="module">
      const boot = async () => {
        if ('serviceWorker' in navigator) {
          try {
            const refreshKey = 'orbit-oak-service-worker-cleanup-v7';
            const hadController = Boolean(navigator.serviceWorker.controller);
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
            if (hadController && sessionStorage.getItem(refreshKey) !== 'done') {
              sessionStorage.setItem(refreshKey, 'done');
              window.location.reload();
              return;
            }
            sessionStorage.removeItem(refreshKey);
          } catch (error) {
            console.warn('Service worker cleanup skipped', error);
          }
        }
        await import('./src/app-v5.js?version=8');
      };
      boot().catch((error) => {
        console.error('Orbit & Oak could not start', error);
        document.getElementById('app').innerHTML = '<main class="boot-error"><h1>Let’s try that again.</h1><p>The learning trail could not load. Refresh once to reconnect.</p></main>';
      });
    </script>
  </body>
</html>
